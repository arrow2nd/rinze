[package]
name = "rinze-zenz"
version.workspace = true
edition.workspace = true

[dependencies]
llama-cpp-2.workspace = true

# build.rs が libgomp をリンクするのは *-gnu ターゲットのときだけなので、OpenMP は Linux だけで有効にする
[target.'cfg(target_os = "linux")'.dependencies]
llama-cpp-2 = { workspace = true, features = ["openmp"] }
